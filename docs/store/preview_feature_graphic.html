<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Feature Graphic Preview (1024x500 PNG)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .preview-container {
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background: #000;
      width: 1024px;
      height: 500px;
    }
    .preview-container img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .meta-box {
      margin-top: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      gap: 32px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
    }
    .meta-title {
      font-size: 12px;
      color: #94a3b8;
    }
    .meta-val {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 4px;
    }
    .actions {
      margin-top: 24px;
    }
    a.download-btn {
      display: inline-block;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s;
    }
    a.download-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h1>Google Play フィーチャーグラフィック (完成版)</h1>
  <p>最新アプリアイコン ＋ 先ほど撮影した本物のスクリーンショット（実写UI）を合成した最終PNG成果物です。</p>

  <div class="preview-container">
    <img src="feature_graphic.png?v=3" alt="Feature Graphic" />
  </div>

  <div class="meta-box">
    <div class="meta-item">
      <span class="meta-title">画像サイズ</span>
      <span class="meta-val">1024 × 500 px</span>
    </div>
    <div class="meta-item">
      <span class="meta-title">画像形式</span>
      <span class="meta-val">PNG (24bit RGBA)</span>
    </div>
    <div class="meta-item">
      <span class="meta-title">ファイル容量</span>
      <span class="meta-val">約 297 KB (上限15MB以下)</span>
    </div>
    <div class="meta-item">
      <span class="meta-title">保存先ファイル</span>
      <span class="meta-val">docs/store/feature_graphic.png</span>
    </div>
  </div>

  <div class="actions">
    <a href="feature_graphic.png" download="feature_graphic.png" class="download-btn">feature_graphic.png をダウンロード</a>
  </div>
</body>
</html>
