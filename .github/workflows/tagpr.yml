name: tagpr

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    name: Run tagpr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
